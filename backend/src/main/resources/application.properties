spring.application.name=eventhub-backend

# --- Database ---
# URL and user have local-dev defaults; the password MUST come from the environment.
spring.datasource.url=${EVENTHUB_DB_URL:jdbc:postgresql://localhost:5433/eventhub}
spring.datasource.username=${EVENTHUB_DB_USER:eventhub_app}
spring.datasource.password=${EVENTHUB_DB_PASSWORD}

# --- JPA / Hibernate ---
# Flyway owns the schema. Hibernate only checks that entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# --- JWT ---
# The secret MUST come from the environment (at least 32 characters).
app.jwt.secret=${EVENTHUB_JWT_SECRET}
app.jwt.issuer=eventhub
app.jwt.access-token-ttl=60m


# --- Optional first-admin bootstrap (leave the variables unset to disable) ---
app.bootstrap-admin.email=${EVENTHUB_ADMIN_EMAIL:}
app.bootstrap-admin.password=${EVENTHUB_ADMIN_PASSWORD:}


# --- Bookings ---
# How long an unpaid booking holds its seats/tickets.
app.booking.hold-duration=15m


# How often the sweeper releases unpaid holds that ran out (ISO-8601 duration).
app.booking.sweep-enabled=true
app.booking.sweep-interval=PT1M

# DEMO payments (no money moves). Off unless explicitly enabled; never enable in production.
app.payments.demo-enabled=${EVENTHUB_DEMO_PAYMENTS:false}


# --- Ticket check-in ---
# Check-in opens this long before the event starts and closes when it ends.
app.checkin.opens-before=6h


# --- Rate limiting (in memory, per server) ---
# Failed logins: per client IP + email, and per client IP overall, inside the window.
app.rate-limit.login-max-failures-per-account=5
app.rate-limit.login-max-failures-per-ip=20
app.rate-limit.login-window=15m
# Registrations per client IP.
app.rate-limit.register-max-per-ip=10
app.rate-limit.register-window=1h

# --- CORS: browser origins allowed to call the API (comma separated; "*" is refused) ---
app.cors.allowed-origins=${EVENTHUB_CORS_ORIGINS:http://localhost:5173}

# --- Request size limit for bodies (bytes) ---
app.http.max-body-bytes=65536

# --- API documentation (Swagger UI at /swagger-ui.html). Set the variable to false to turn it off. ---
springdoc.api-docs.enabled=${EVENTHUB_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${EVENTHUB_API_DOCS_ENABLED:true}

# --- Never leak internals in error responses ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# --- Hosting platforms ---
# Platforms such as Render tell the app which port to listen on through the PORT variable.
server.port=${PORT:8080}

# Behind a reverse proxy the app only sees the proxy's address. Set EVENTHUB_FORWARD_HEADERS=native on a hosting
# platform so the real client address is used (the login rate limiter depends on it). Leave it at "none" locally.
server.forward-headers-strategy=${EVENTHUB_FORWARD_HEADERS:none}

# Database connection pool size. The default matches the library default; use a small value on a free-tier database.
spring.datasource.hikari.maximum-pool-size=${EVENTHUB_DB_POOL_SIZE:10}
