spring.application.name=eventhub-backend

# --- Database ---
# URL and user have local-dev defaults; the password MUST come from the environment.
spring.datasource.url=${EVENTHUB_DB_URL:jdbc:postgresql://localhost:5433/eventhub}
spring.datasource.username=${EVENTHUB_DB_USER:eventhub_app}
spring.datasource.password=${EVENTHUB_DB_PASSWORD}

# --- JPA / Hibernate ---
# Flyway owns the schema. Hibernate only checks that entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# --- JWT ---
# The secret MUST come from the environment (at least 32 characters).
app.jwt.secret=${EVENTHUB_JWT_SECRET}
app.jwt.issuer=eventhub
app.jwt.access-token-ttl=60m


# --- Optional first-admin bootstrap (leave the variables unset to disable) ---
app.bootstrap-admin.email=${EVENTHUB_ADMIN_EMAIL:}
app.bootstrap-admin.password=${EVENTHUB_ADMIN_PASSWORD:}


# --- Bookings ---
# How long an unpaid booking holds its seats/tickets.
app.booking.hold-duration=15m