# The real datasource URL, user and password come from the Testcontainers container.
# This placeholder only stops Spring from demanding the EVENTHUB_DB_PASSWORD
# environment variable that application.properties requires for the real app.
spring.datasource.password=supplied-by-testcontainers

# Test-only JWT secret. It protects nothing real and is never used outside tests.
app.jwt.secret=test-only-secret-not-used-anywhere-else-1234567890