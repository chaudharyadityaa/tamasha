name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21 and PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Throwaway values, only for the test run. No real secret ever goes into the repository.
    env:
      EVENTHUB_DB_PASSWORD: ci-only-password
      EVENTHUB_JWT_SECRET: ci-only-secret-for-tests-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The wrapper script may have lost its executable bit when the repository was created on Windows.
      - run: chmod +x mvnw
      - name: Build and run all backend tests
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (lint, tests and production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Unit, integration and accessibility tests
        run: npm test